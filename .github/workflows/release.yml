name: Release
on:
  release:
    types: [published]
jobs:
  ci:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-release-publish.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
  installer:
    runs-on: windows-latest
    needs: ci
    permissions:
      contents: write
      packages: read
    env:
      APP_PROJECT: ../novolis-apps/src/LiveStudio/studio/LiveStudio.csproj
      HOST_PROJECT: ../novolis-apps/src/LiveStudio/host/LiveStudio.Host.csproj
      PACKAGING_PROJECT: src/Novolis.Avalonia.Packaging.Inno/Novolis.Avalonia.Packaging.Inno.csproj
      APP_PUBLISH_DIR: ${{ github.workspace }}\artifacts\live-studio\app
      HOST_PUBLISH_DIR: ${{ github.workspace }}\artifacts\live-studio\host
      INSTALLER_DIR: ${{ github.workspace }}\artifacts\live-studio\installer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: Novolis-Platform/novolis-workflows/actions/checkout-sibling-repos@main

      - name: Checkout governance build targets
        shell: bash
        run: |
          set -euo pipefail
          gov="../novolis-governance"
          if [ ! -f "$gov/build/Novolis.Version.targets" ]; then
            git clone --depth 1 --branch main \
              "https://github.com/${{ github.repository_owner }}/novolis-governance.git" "$gov"
          fi

      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x

      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ github.token }}

      - uses: Novolis-Platform/novolis-workflows/actions/resolve-release-version@main

      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver

      - name: Publish app and host payloads
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package-version }}
          ASSEMBLY_VERSION: ${{ steps.ver.outputs.assembly-version }}
          FILE_VERSION: ${{ steps.ver.outputs.file-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:APP_PUBLISH_DIR, $env:HOST_PUBLISH_DIR, $env:INSTALLER_DIR | Out-Null

          $versionArgs = @(
            "-p:AssemblyVersion=$env:ASSEMBLY_VERSION"
            "-p:FileVersion=$env:FILE_VERSION"
            "-p:InformationalVersion=$env:PACKAGE_VERSION"
          )

          dotnet publish $env:APP_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $env:APP_PUBLISH_DIR `
            @versionArgs
          if ($LASTEXITCODE -ne 0) { throw "Publishing the app payload failed with exit code $LASTEXITCODE." }

          dotnet publish $env:HOST_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $env:HOST_PUBLISH_DIR `
            @versionArgs
          if ($LASTEXITCODE -ne 0) { throw "Publishing the host payload failed with exit code $LASTEXITCODE." }

          $hostDest = Join-Path $env:APP_PUBLISH_DIR 'host'
          New-Item -ItemType Directory -Force -Path $hostDest | Out-Null
          Copy-Item -Path (Join-Path $env:HOST_PUBLISH_DIR '*') -Destination $hostDest -Recurse -Force

      - name: Generate Inno script
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet msbuild $env:PACKAGING_PROJECT `
            -t:NovolisGenerateInnoScript `
            -p:NovolisInnoAppName='Novolis Audio Live' `
            -p:NovolisInnoAppVersion=$env:PACKAGE_VERSION `
            -p:NovolisInnoPublishDir=$env:APP_PUBLISH_DIR `
            -p:NovolisInnoAppExeName='Novolis.Audio.Live.Studio.exe' `
            -p:NovolisInnoOutputDir=$env:INSTALLER_DIR `
            -p:NovolisInnoAppId='Novolis.Audio.Live.Studio' `
            -p:NovolisInnoDefaultGroupName='Novolis Audio Live' `
            -p:NovolisInnoOutputBaseFilename="NovolisAudioLiveSetup-$env:PACKAGE_VERSION-win-x64" `
            -p:NovolisInnoInstallDirName='Novolis\Novolis Audio Live'
          if ($LASTEXITCODE -ne 0) { throw "Generating the Inno script failed with exit code $LASTEXITCODE." }

      - uses: Novolis-Platform/novolis-workflows/actions/install-inno-setup@main
        id: inno

      - name: Build installer
        id: build-installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package-version }}
          ISCC_PATH: ${{ steps.inno.outputs.iscc-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:INSTALLER_DIR 'novolis-audio-live.iss'
          & $env:ISCC_PATH $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE."
          }
          $installer = Join-Path $env:INSTALLER_DIR "NovolisAudioLiveSetup-$env:PACKAGE_VERSION-win-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer not found: $installer"
          }
          "installer-path=$installer" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - uses: Novolis-Platform/novolis-workflows/actions/ensure-github-release@main
        with:
          tag: ${{ github.event.release.tag_name }}
          title: ${{ github.event.release.tag_name }}
          assets: ${{ steps.build-installer.outputs.installer-path }}
          generate-notes: 'false'
